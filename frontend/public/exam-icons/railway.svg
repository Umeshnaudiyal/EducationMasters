<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Railways Maroon & Gold Outer Ring -->
  <circle cx="50" cy="50" r="48" fill="#4C0519" stroke="#E11D48" stroke-width="2.5" />
  <circle cx="50" cy="50" r="44" fill="#881337" stroke="#FECDD3" stroke-width="1" />
  
  <!-- Train Locomotive Front Profile -->
  <rect x="30" y="34" width="40" height="40" rx="8" fill="#FFFFFF" />
  <rect x="34" y="38" width="32" height="16" rx="4" fill="#0F172A" />
  <!-- Windshield Divider -->
  <line x1="50" y1="38" x2="50" y2="54" stroke="#FFFFFF" stroke-width="2" />
  <!-- Headlights -->
  <circle cx="38" cy="62" r="3" fill="#E11D48" />
  <circle cx="62" cy="62" r="3" fill="#E11D48" />
  <circle cx="50" cy="64" r="2.5" fill="#FBBF24" />
  <!-- Track cowcatcher -->
  <polygon points="34,74 66,74 60,80 40,80" fill="#475569" />
  <!-- Upper Pantograph / Light -->
  <rect x="46" y="28" width="8" height="6" rx="1" fill="#FBBF24" />
</svg>
